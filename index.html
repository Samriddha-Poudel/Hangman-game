<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>



    <div class="game-mdl">
        <div class="content">
            <img src="hangman-game-images/images/lost.gif" alt="lost">
            <h4>Game Over!</h4>
            <p>The correct word was: <b>rainbow</b></p>
            <button class="play-agn"> Play Again</button>
        </div>
    </div>
<header>

    
    
    <div class="logo">
    <img src="hangman-game-images/images/nav bar imgg.jpg" alt="nav bar imgg">
<h2>Hangman Game</h2>



    </div>

</button>
    
    
</header>

    

    <div class="container">
        <div class="hangman-container">
            <img src="hangman-game-images/images/hangman-0.svg"alt="">
            <h1>Hangman Game</h1>
        </div>
        <div class="gamebox">
            <ul class="worddisplay">
                <li class="letter"></li>
                <li class="letter"></li>
                <li class="letter guessed">a</li>
                <li class="letter"></li>
                <li class="letter"></li>
                <li class="letter"></li>
                <li class="letter"></li>
            </ul>
            <h4 class="hint-msg">
                Hint:
                <b>Lorem ipsum dolor sit amet consectetur adipisicing elit.</b>
            </h4>
            <h4 class="guess-txt">
                Incorrect guesses:
                <b>0/6</b>
            </h4>
            <div class="keyboard">
                <button>a</button><button>b</button><button>c</button><button>d</button>
                <button>e</button><button>f</button><button>g</button><button>h</button>
                <button>i</button><button>j</button><button>k</button><button>l</button>
                <button>m</button><button>n</button><button>o</button><button>p</button>
                <button>q</button><button>r</button><button>s</button><button>t</button>
                <button>u</button><button>v</button><button>w</button><button>x</button>
                <button>y</button><button>z</button>
            </div>
        </div>
    </div>
</body>
</html>
